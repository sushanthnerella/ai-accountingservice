[project]
name = "accounting-intelligence-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "celery>=5.4.0",
    "redis>=5.0.4",
    "pyjwt>=2.8.0",
    "argon2-cffi>=23.1.0",
    "bcrypt>=4.1.2",
    "cryptography>=42.0.7",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
